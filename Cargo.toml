[package]
name = "folium"
version = "0.1.0"
edition = "2021"
description = "Folium - leitor de EPUB estilo Kindle para PC, rapido, com historico de pagina"
license = "MIT"

[dependencies]
eframe = { version = "0.28", default-features = true }
egui = "0.28"
rfd = "0.15"
epub = "2.1"
html2text = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sha2 = "0.10"
